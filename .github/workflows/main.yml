name: CodeSensei Morning

on:
  schedule:
    - cron: '0 8 * * *'  # 10:00 по Швеции (UTC+2)
  workflow_dispatch:  # ручной запуск для теста

jobs:
  send_morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install groq python-dotenv python-telegram-bot
      
      - name: Send morning message
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python morning_sender.py
