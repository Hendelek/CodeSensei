name: CodeSensei Evening

on:
  schedule:
    - cron: '0 17 * * *'  # 19:00 по Швеции (UTC+2)
  workflow_dispatch:

jobs:
  send_evening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install groq python-dotenv python-telegram-bot==22.7
      
      - name: Send evening task
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python evening_sender.py
